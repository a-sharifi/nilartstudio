name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nilart
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: nilart_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nilart -d nilart_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NILART_TEST_DATABASE_URL: postgresql+psycopg://nilart:ci-local-only@localhost:5432/nilart_test
      TEST_DATABASE_URL: postgresql+psycopg://nilart:ci-local-only@localhost:5432/nilart_test
      NILART_TEST_REDIS_IMAGE: redis:7-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.lock
      - run: pip install -r Backend/requirements.lock
      - run: pip install --no-deps -e 'Backend[dev]'
      - run: docker pull redis:7-alpine
      - run: pytest
        working-directory: Backend
      - run: ruff check .
        working-directory: Backend
      - run: mypy src
        working-directory: Backend
      - run: docker build -t nilart-api-ci Backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t nilart-web-ci .
  infrastructure:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-validation-only
      REDIS_PASSWORD: ci-validation-only
      RABBITMQ_PASSWORD: ci-validation-only
      MINIO_ROOT_USER: ci-user
      MINIO_ROOT_PASSWORD: ci-validation-only
      MINIO_BUCKET: nilart-ci
      PRODUCTION_BIND_IP: 127.0.0.1
      TLS_CERT_PATH: /tmp/supplied-fullchain.pem
      TLS_KEY_PATH: /tmp/supplied-privkey.pem
      MINIO_PRODUCTION_IMAGE: registry.example.invalid/reviewed-storage:ci-config-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/compose.yaml config --quiet
      - run: docker compose -f infra/docker/compose.yaml -f infra/docker/compose.production.yaml config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull postgres:17-alpine
      - name: PostgreSQL backup and isolated restoration tests
        run: python3 -m unittest discover -s infra/tests -v
        env:
          NILART_RUN_BACKUP_INTEGRATION: '1'
          NILART_BACKUP_TEST_IMAGE: postgres:17-alpine
