[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nilart-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "alembic", "psycopg[binary]", "redis", "celery", "pydantic-settings"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/nilart/contexts/catalog", "src/nilart/shared/money.py", "src/nilart/bootstrap/catalog_demo.py"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
