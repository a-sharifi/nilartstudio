name: nilart
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nilart
      POSTGRES_USER: nilart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nilart -d nilart']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nilart
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
  minio:
    image: nilart-minio-development:07c3a429
    build: {context: ../minio, dockerfile: Dockerfile}
    restart: unless-stopped
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: {context: ../../Backend, dockerfile: Dockerfile}
    restart: unless-stopped
    environment: &api_environment
      NILART_ENVIRONMENT: ${NILART_ENVIRONMENT:-development}
      NILART_PUBLIC_ORIGIN: ${NILART_PUBLIC_ORIGIN:-http://localhost:8080}
      NILART_OTP_HMAC_KEY: ${NILART_OTP_HMAC_KEY:-}
      NILART_DEV_MODE: ${NILART_DEV_MODE:-false}
      NILART_FAKE_SMS: ${NILART_FAKE_SMS:-false}
      NILART_SMS_MODE: ${NILART_SMS_MODE:-disabled}
      NILART_DATABASE_URL: postgresql+psycopg://nilart:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/nilart
      NILART_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      NILART_BROKER_URL: amqp://nilart:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672//
      NILART_S3_ENDPOINT_URL: http://minio:9000
      NILART_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      NILART_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      NILART_S3_BUCKET: ${MINIO_BUCKET:-nilart}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  worker:
    build: {context: ../../Backend, dockerfile: Dockerfile}
    restart: unless-stopped
    command: [celery, -A, 'nilart.bootstrap.worker:celery', worker, --loglevel=INFO, --hostname=worker@%h]
    environment: *api_environment
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A nilart.bootstrap.worker:celery inspect ping --destination "worker@$$HOSTNAME" --timeout 5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  web:
    build: {context: ../../Frontend, dockerfile: Dockerfile}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      NEXT_PUBLIC_API_BASE_URL: /api
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:80']
    volumes: ['../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
  scheduler:
    profiles: [scheduler]
    build: {context: ../../Backend, dockerfile: Dockerfile}
    restart: unless-stopped
    command: [celery, -A, 'nilart.bootstrap.worker:celery', beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule, --pidfile=/tmp/celerybeat.pid]
    environment: *api_environment
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'test -s /tmp/celerybeat.pid && kill -0 "$$(cat /tmp/celerybeat.pid)"']
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
