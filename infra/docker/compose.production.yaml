# Compose 2.24.4+ required for !override.
services:
  minio:
    build: !reset null
    image: ${MINIO_PRODUCTION_IMAGE:?Supply a security-reviewed compatible storage image}
  scheduler:
    environment:
      NILART_ENVIRONMENT: production
      NILART_S3_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET}
  api:
    environment:
      NILART_ENVIRONMENT: production
      NILART_PUBLIC_ORIGIN: ${NILART_PUBLIC_ORIGIN:?Set the public HTTPS origin}
      NILART_S3_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET}
  worker:
    environment:
      NILART_ENVIRONMENT: production
      NILART_S3_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET}
  nginx:
    ports: !override
      - '${PRODUCTION_BIND_IP:?Set PRODUCTION_BIND_IP}:80:80'
      - '${PRODUCTION_BIND_IP:?Set PRODUCTION_BIND_IP}:443:443'
    volumes: !override
      - ../nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${TLS_CERT_PATH:?Set absolute TLS_CERT_PATH}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TLS_KEY_PATH:?Set absolute TLS_KEY_PATH}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
        bind: {create_host_path: false}
