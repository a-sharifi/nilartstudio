# Docker replaces container IPs during rebuilds; resolve service names dynamically.
# https://nginx.org/en/docs/http/ngx_http_upstream_module.html#server
resolver 127.0.0.11 valid=5s ipv6=off;
upstream nilart_api {
    zone nilart_api 64k;
    server api:8000 resolve;
}
upstream nilart_web {
    zone nilart_web 64k;
    server web:3000 resolve;
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api {
        proxy_pass http://nilart_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://nilart_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
